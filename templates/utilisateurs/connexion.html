{% extends 'base.html' %}

{% block title %}Connexion - Espace Client{% endblock %}

{% block content %}
  <div class="container">
    <div class="row">
      <div class="col-sm-9 col-md-7 col-lg-5 mx-auto">
        <div class="card border-0 shadow rounded-3 my-5">
          <div class="card-body p-4 p-sm-5">
            <h5 class="card-title text-center mb-5 fw-light fs-5">Se connecter</h5>
            <form>
              <div class="form-floating mb-3">
                <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                <label for="floatingInput">Adresse Email</label>
              </div>
              <div class="form-floating mb-3">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                <label for="floatingPassword">Mots de passe</label>
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" value="" id="rememberPasswordCheck">
                <label class="form-check-label" for="rememberPasswordCheck">
                  Se souvenir du mots de passe
                </label>
              </div>
              <div class="d-grid">
                <button class="btn btn-primary btn-login text-uppercase fw-bold" type="submit">Sign
                  in</button>
              </div>
              <hr class="my-4">
              <div class="d-grid mb-2">
              
 {% load socialaccount %}

<div class="d-grid mb-2">
  <a href="{% provider_login_url 'google' %}" class="btn btn-google btn-login text-uppercase fw-bold text-center" style="text-decoration: none;">
    <i class="fab fa-google me-2"></i> Se connecter avec Google
  </a>
</div>

<div class="d-grid">
  <a href="{% provider_login_url 'facebook' %}" class="btn btn-facebook btn-login text-uppercase fw-bold text-center" style="text-decoration: none;">
    <i class="fab fa-facebook-f me-2"></i> Se connecter avec Facebook
  </a>
</div>
</div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
