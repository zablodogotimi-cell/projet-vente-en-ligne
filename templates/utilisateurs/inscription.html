{% extends 'base.html' %}

{% block title %}Inscription - Espace Client{% endblock %}

{% block content %}
  <div class="container">
    <div class="row">
      <div class="col-lg-10 col-xl-9 mx-auto">
        <div class="card flex-row my-5 border-0 shadow rounded-3 overflow-hidden">
          <div class="card-img-left d-none d-md-flex">
            </div>
          <div class="card-body p-4 p-sm-5">
            <h5 class="card-title text-center mb-5 fw-light fs-5">Inscription</h5>
            
            <form method="POST">
              {% csrf_token %}

              <div class="form-floating mb-3">
                <input type="text" name="username" class="form-control" id="floatingInputUsername" placeholder="Mon username" required autofocus>
                <label for="floatingInputUsername">Username</label>
              </div>

              <div class="form-floating mb-3">
                <input type="email" name="email" class="form-control" id="floatingInputEmail" placeholder="name@example.com" required>
                <label for="floatingInputEmail">Adresse email</label>
              </div>

              <hr>

              <div class="form-floating mb-3">
                <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                <label for="floatingPassword">Mot de passe</label>
              </div>

              <div class="form-floating mb-3">
                <input type="password" name="password_confirm" class="form-control" id="floatingPasswordConfirm" placeholder="Mot de passe" required>
                <label for="floatingPasswordConfirm">Vérification du mot de passe</label>
              </div>

              <div class="form-floating mb-4"> 
                <select class="form-select" name="profession" id="profession" required>
                  <option value="" selected disabled hidden>Choisissez votre rôle...</option>
                  <option value="vendeur">Vendeur</option>
                  <option value="acheteur">Acheteur</option>
                  <option value="vendeur & acheteur">Vendeur & Acheteur</option>
                </select>
                <label for="profession">Profession / Rôle</label>
              </div>

              <div class="d-grid mb-2">
                <button class="btn btn-lg btn-primary btn-login fw-bold text-uppercase" type="submit">S'Inscrire</button>
              </div>

              <a class="d-block text-center mt-2 small link-modern" href="{% url 'connexion' %}">Vous avez un compte ? Connectez-vous</a>

              <hr class="my-4">

            {% load socialaccount %}

<div class="d-grid mb-2">
  <a href="{% provider_login_url 'google' %}" class="btn btn-google btn-login text-uppercase fw-bold text-center" style="text-decoration: none;">
    <i class="fab fa-google me-2"></i> Se connecter avec Google
  </a>
</div>

<div class="d-grid">
  <a href="{% provider_login_url 'facebook' %}" class="btn btn-facebook btn-login text-uppercase fw-bold text-center" style="text-decoration: none;">
    <i class="fab fa-facebook-f me-2"></i> Se connecter avec Facebook
  </a>
</div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
