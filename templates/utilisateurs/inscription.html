{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0 rounded-3 my-5">
                <div class="card-body p-4 p-sm-5">
                    <h5 class="card-title text-center mb-4 fw-light fs-5">Créer un compte</h5>
                    
                    {% if messages %}
                        <div class="messages mb-3">
                            {% for message in messages %}
                                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}

                    <form method="POST" action="{% url 'inscription' %}">
                        {% csrf_token %}
                        
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="floatingUsername" name="username" placeholder="Nom d'utilisateur" required>
                            <label for="floatingUsername">Nom d'utilisateur</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="floatingEmail" name="email" placeholder="name@example.com" required>
                            <label for="floatingEmail">Adresse Email</label>
                        </div>

                        <div class="form-floating mb-3">
                            <select class="form-select" id="floatingRole" name="role" required>
                                <option value="" selected disabled>Choisissez votre rôle</option>
                                <option value="Client">Acheteur (Client)</option>
                                <option value="Vendeur">Vendeur</option>
                            </select>
                            <label for="floatingRole">Type de compte</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="floatingPassword" name="password" placeholder="Mot de passe" required>
                            <label for="floatingPassword">Mot de passe</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="floatingConfirmPassword" name="password_confirm" placeholder="Confirmer le mot de passe" required>
                            <label for="floatingConfirmPassword">Confirmer le mot de passe</label>
                        </div>

                        <div class="d-grid mb-3">
                            <button class="btn btn-primary btn-login text-uppercase fw-bold" type="submit">S'inscrire</button> 
                        </div>
                        
                        <hr class="my-4">

                        <div class="text-center">
                            <p>Vous avez déjà un compte ? <a href="{% url 'connexion' %}">Connectez-vous ici</a></p>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
